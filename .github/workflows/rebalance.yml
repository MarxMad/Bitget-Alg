name: Rebalance cross-sectional momentum

# The strategy rebalances once every 24h, so it needs a scheduled job, not a
# server. 07:10 UTC — a few minutes off the hour, since GitHub's scheduler is
# busiest exactly on the hour and delays runs queued there.
on:
  schedule:
    - cron: "10 7 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write the RSA key from secrets
        run: |
          mkdir -p ~/.bitget
          printf '%s\n' "${{ secrets.BITGET_PRIVATE_KEY }}" > ~/.bitget/key.pem
          chmod 600 ~/.bitget/key.pem

      - name: Rebalance
        env:
          BITGET_ACCESS_KEY: ${{ secrets.BITGET_ACCESS_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          BITGET_PRIVATE_KEY_PATH: /home/runner/.bitget/key.pem
          # Set this to "1" only on a PRIVATE repo. On a public one the
          # Actions log is public, and REDACT_BALANCES keeps equity and
          # position sizes out of it. Signals are safe either way — anyone
          # can derive them from public prices.
          REDACT_BALANCES: "1"
        run: python -m strategies.cross_sectional.strategy --once

      - name: Always wipe the key
        if: always()
        run: shred -u ~/.bitget/key.pem 2>/dev/null || rm -f ~/.bitget/key.pem
